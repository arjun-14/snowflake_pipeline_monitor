          - load time
        description: When the load completed
        expr: LAST_LOAD_TIME
        data_type: TIMESTAMP
    time_dimensions:
      - name: load_date
        synonyms:
          - date
          - day
          - when
        description: The date of the load
        expr: LAST_LOAD_TIME::DATE
        data_type: DATE
      - name: load_at
        synonyms:
          - timestamp
          - hour
          - last N hours
        description: Exact timestamp the load completed — use for hour-level filtering
        expr: LAST_LOAD_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_loads
        synonyms:
