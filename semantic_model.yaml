name: Snowflake Data Ecosystem Monitor
description: >
  Semantic model covering the full Snowflake data ecosystem: task/pipeline execution,
  warehouse credit consumption, query performance, Snowpipe and COPY ingestion,
  dynamic table transformation health, and cost attribution. Enables natural language
  questions about reliability, performance, cost, and operational efficiency across
  every layer of the data platform.

tables:
  - name: metering_history
    description: >
      Hourly credit consumption across all Snowflake services including warehouse compute,
      serverless features, cloud services, and AI services. Use for cost breakdown by
      service type, week-over-week comparisons, and identifying what drives the bill.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: METERING_HISTORY
    filters:
      - name: recent_metering
        synonyms:
          - recent
          - last 30 days
        description: Filters to metering data in the last 30 days
        expr: START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
    dimensions:
      - name: service_type
        synonyms:
          - service
          - cost category
          - billing category
        description: >
          The Snowflake service consuming credits. Values include WAREHOUSE_METERING,
          AI_SERVICES, SNOWPARK_CONTAINER_SERVICES, AUTO_CLUSTERING, PIPE, CORTEX_CODE_SNOWSIGHT, etc.
        expr: SERVICE_TYPE
        data_type: TEXT
      - name: name
        synonyms:
          - resource name
          - warehouse name
          - service name
        description: Name of the specific resource (warehouse, pipe, etc.) consuming credits
        expr: NAME
        data_type: TEXT
    time_dimensions:
      - name: metering_date
        synonyms:
          - date
          - day
          - when
        description: The date of the metering interval
        expr: START_TIME::DATE
        data_type: DATE
      - name: metering_at
        synonyms:
          - timestamp
          - hour
        description: Exact timestamp of the metering interval
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_credits
        synonyms:
          - credits used
          - cost
          - spend
          - bill
        description: Total credits consumed
        expr: SUM(CREDITS_USED)
        data_type: NUMBER
      - name: compute_credits
        synonyms:
          - compute cost
        description: Credits used for compute
        expr: SUM(CREDITS_USED_COMPUTE)
        data_type: NUMBER
      - name: cloud_service_credits
        synonyms:
          - cloud services cost
        description: Credits used for cloud services
        expr: SUM(CREDITS_USED_CLOUD_SERVICES)
        data_type: NUMBER

  - name: metering_daily_history
    description: >
      Daily aggregated credit consumption by service type. Use for daily trends,
      month-over-month comparisons, and billing analysis.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: METERING_DAILY_HISTORY
    filters:
      - name: recent_daily
        synonyms:
          - recent
          - last 30 days
        description: Filters to the last 30 days
        expr: USAGE_DATE >= DATEADD('day', -30, CURRENT_DATE())
    dimensions:
      - name: service_type
        synonyms:
          - service
          - cost category
        description: The Snowflake service type
        expr: SERVICE_TYPE
        data_type: TEXT
    time_dimensions:
      - name: usage_date
        synonyms:
          - date
          - day
          - when
        description: The date of usage
        expr: USAGE_DATE
        data_type: DATE
    measures:
      - name: credits_billed
        synonyms:
          - billed credits
          - daily cost
        description: Total credits billed for the day
        expr: SUM(CREDITS_BILLED)
        data_type: NUMBER
      - name: credits_used_compute
        synonyms:
          - compute credits
        description: Compute credits used
        expr: SUM(CREDITS_USED_COMPUTE)
        data_type: NUMBER
      - name: credits_used_cloud_services
        synonyms:
          - cloud services credits
        description: Cloud services credits used
        expr: SUM(CREDITS_USED_CLOUD_SERVICES)
        data_type: NUMBER

  - name: query_attribution_history
    description: >
      Per-query credit attribution showing exactly how many credits each query consumed.
      Use for identifying expensive queries, top-spending users, and query cost patterns.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: QUERY_ATTRIBUTION_HISTORY
    filters:
      - name: recent_attribution
        synonyms:
          - recent
          - last 7 days
        description: Filters to last 7 days
        expr: START_TIME >= DATEADD('day', -7, CURRENT_DATE())
    dimensions:
      - name: query_id
        synonyms:
          - query identifier
        description: Unique query identifier
        expr: QUERY_ID
        data_type: TEXT
      - name: warehouse_name
        synonyms:
          - warehouse
          - compute
        description: Warehouse that executed the query
        expr: WAREHOUSE_NAME
        data_type: TEXT
      - name: user_name
        synonyms:
          - user
          - who
        description: User who ran the query
        expr: USER_NAME
        data_type: TEXT
      - name: query_parameterized_hash
        synonyms:
          - query hash
          - query pattern
          - parameterized hash
        description: Hash grouping similar queries together
        expr: QUERY_PARAMETERIZED_HASH
        data_type: TEXT
    time_dimensions:
      - name: attribution_date
        synonyms:
          - date
          - day
        description: Date the query ran
        expr: START_TIME::DATE
        data_type: DATE
      - name: attribution_at
        synonyms:
          - timestamp
          - hour
        description: Exact timestamp
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: credits_attributed_compute
        synonyms:
          - query cost
          - attributed credits
          - compute credits per query
        description: Credits attributed to compute for this query
        expr: SUM(CREDITS_ATTRIBUTED_COMPUTE)
        data_type: NUMBER
      - name: credits_query_acceleration
        synonyms:
          - QAS credits
          - acceleration credits
        description: Credits used for query acceleration service
        expr: SUM(CREDITS_USED_QUERY_ACCELERATION)
        data_type: NUMBER
      - name: total_query_credits
        synonyms:
          - total query cost
          - all query credits
        description: Total credits per query (compute + acceleration)
        expr: SUM(CREDITS_ATTRIBUTED_COMPUTE + COALESCE(CREDITS_USED_QUERY_ACCELERATION, 0))
        data_type: NUMBER
      - name: query_count
        synonyms:
          - number of queries
        description: Count of queries
        expr: COUNT(DISTINCT QUERY_ID)
        data_type: NUMBER

  - name: serverless_task_history
    description: >
      Credit consumption by serverless tasks. Use to identify expensive serverless
      tasks and track their cost over time.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: SERVERLESS_TASK_HISTORY
    filters:
      - name: recent_serverless
        synonyms:
          - recent
          - last 7 days
        description: Filters to last 7 days
        expr: START_TIME >= DATEADD('day', -7, CURRENT_DATE())
    dimensions:
      - name: task_name
        synonyms:
          - task
          - serverless task
        description: Name of the serverless task
        expr: TASK_NAME
        data_type: TEXT
      - name: database_name
        synonyms:
          - database
        description: Database containing the task
        expr: DATABASE_NAME
        data_type: TEXT
      - name: schema_name
        synonyms:
          - schema
        description: Schema containing the task
        expr: SCHEMA_NAME
        data_type: TEXT
    time_dimensions:
      - name: task_date
        synonyms:
          - date
          - day
        description: Date the task ran
        expr: START_TIME::DATE
        data_type: DATE
      - name: task_at
        synonyms:
          - timestamp
        description: Exact timestamp
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_credits
        synonyms:
          - credits used
          - serverless cost
        description: Total credits consumed by serverless tasks
        expr: SUM(CREDITS_USED)
        data_type: NUMBER

  - name: container_services_history
    description: >
      Credit consumption by Snowpark Container Services compute pools. Use to identify
      expensive compute pools and track container costs.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: SNOWPARK_CONTAINER_SERVICES_HISTORY
    filters:
      - name: recent_containers
        synonyms:
          - recent
          - last 7 days
        description: Filters to last 7 days
        expr: START_TIME >= DATEADD('day', -7, CURRENT_DATE())
    dimensions:
      - name: compute_pool_name
        synonyms:
          - compute pool
          - pool
          - container pool
        description: Name of the compute pool
        expr: COMPUTE_POOL_NAME
        data_type: TEXT
      - name: application_name
        synonyms:
          - application
          - app
        description: Application using the compute pool
        expr: APPLICATION_NAME
        data_type: TEXT
    time_dimensions:
      - name: container_date
        synonyms:
          - date
          - day
        description: Date of usage
        expr: START_TIME::DATE
        data_type: DATE
      - name: container_at
        synonyms:
          - timestamp
        description: Exact timestamp
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_credits
        synonyms:
          - credits used
          - container cost
          - SPCS cost
        description: Total credits consumed by container services
        expr: SUM(CREDITS_USED)
        data_type: NUMBER

  - name: database_storage_usage
    description: >
      Daily storage consumption by database including active data, failsafe, and
      hybrid table storage. Use to identify storage-heavy databases and growth trends.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: DATABASE_STORAGE_USAGE_HISTORY
    filters:
      - name: recent_storage
        synonyms:
          - recent
          - last 30 days
        description: Filters to last 30 days
        expr: USAGE_DATE >= DATEADD('day', -30, CURRENT_DATE())
    dimensions:
      - name: database_name
        synonyms:
          - database
          - db
        description: Name of the database
        expr: DATABASE_NAME
        data_type: TEXT
    time_dimensions:
      - name: usage_date
        synonyms:
          - date
          - day
        description: Date of storage measurement
        expr: USAGE_DATE
        data_type: DATE
    measures:
      - name: total_storage_gb
        synonyms:
          - storage size
          - database size
          - storage used
        description: Total storage in gigabytes (database + failsafe + hybrid)
        expr: ROUND(AVG(AVERAGE_DATABASE_BYTES + AVERAGE_FAILSAFE_BYTES + COALESCE(AVERAGE_HYBRID_TABLE_STORAGE_BYTES, 0)) / POW(1024, 3), 2)
        data_type: NUMBER
      - name: database_storage_gb
        synonyms:
          - active storage
        description: Active database storage in gigabytes
        expr: ROUND(AVG(AVERAGE_DATABASE_BYTES) / POW(1024, 3), 2)
        data_type: NUMBER
      - name: failsafe_storage_gb
        synonyms:
          - failsafe
        description: Failsafe storage in gigabytes
        expr: ROUND(AVG(AVERAGE_FAILSAFE_BYTES) / POW(1024, 3), 2)
        data_type: NUMBER

  - name: data_transfer_history
    description: >
      Data transfer between regions and cloud providers. Use to identify cross-region
      transfer costs and egress patterns.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: DATA_TRANSFER_HISTORY
    filters:
      - name: recent_transfers
        synonyms:
          - recent
          - last 7 days
        description: Filters to last 7 days
        expr: START_TIME >= DATEADD('day', -7, CURRENT_DATE())
    dimensions:
      - name: target_cloud
        synonyms:
          - destination cloud
          - cloud provider
        description: Target cloud provider (AWS, Azure, GCP)
        expr: TARGET_CLOUD
        data_type: TEXT
      - name: target_region
        synonyms:
          - destination region
          - region
        description: Target region
        expr: TARGET_REGION
        data_type: TEXT
      - name: source_cloud
        synonyms:
          - origin cloud
        description: Source cloud provider
        expr: SOURCE_CLOUD
        data_type: TEXT
      - name: source_region
        synonyms:
          - origin region
        description: Source region
        expr: SOURCE_REGION
        data_type: TEXT
      - name: transfer_type
        synonyms:
          - type
          - transfer category
        description: Type of transfer (COPY, REPLICATION, etc.)
        expr: TRANSFER_TYPE
        data_type: TEXT
    time_dimensions:
      - name: transfer_date
        synonyms:
          - date
          - day
        description: Date of transfer
        expr: START_TIME::DATE
        data_type: DATE
    measures:
      - name: total_gb_transferred
        synonyms:
          - data transferred
          - transfer volume
          - egress
        description: Total gigabytes transferred
        expr: ROUND(SUM(BYTES_TRANSFERRED) / POW(1024, 3), 2)
        data_type: NUMBER
      - name: transfer_count
        synonyms:
          - number of transfers
        description: Count of transfer operations
        expr: COUNT(*)
        data_type: NUMBER

  - name: automatic_clustering_history
    description: >
      Auto-clustering credit consumption by table. Use to identify tables driving
      clustering expenses and optimize clustering keys.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: AUTOMATIC_CLUSTERING_HISTORY
    filters:
      - name: recent_clustering
        synonyms:
          - recent
          - last 30 days
        description: Filters to last 30 days
        expr: START_TIME >= DATEADD('day', -30, CURRENT_DATE())
    dimensions:
      - name: database_name
        synonyms:
          - database
        description: Database containing the clustered table
        expr: DATABASE_NAME
        data_type: TEXT
      - name: schema_name
        synonyms:
          - schema
        description: Schema containing the clustered table
        expr: SCHEMA_NAME
        data_type: TEXT
      - name: table_name
        synonyms:
          - table
          - clustered table
        description: Name of the auto-clustered table
        expr: TABLE_NAME
        data_type: TEXT
    time_dimensions:
      - name: clustering_date
        synonyms:
          - date
          - day
        description: Date of clustering activity
        expr: START_TIME::DATE
        data_type: DATE
    measures:
      - name: total_credits
        synonyms:
          - clustering cost
          - clustering credits
        description: Total credits consumed by auto-clustering
        expr: ROUND(SUM(CREDITS_USED), 2)
        data_type: NUMBER
      - name: clustering_events
        synonyms:
          - number of reclusters
          - recluster count
        description: Number of clustering operations
        expr: COUNT(*)
        data_type: NUMBER

  - name: access_history
    description: >
      Record of which objects and columns were accessed by queries. Use for
      table popularity, unused table detection, and data governance.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: ACCESS_HISTORY
    filters:
      - name: recent_access
        synonyms:
          - recent
          - last 30 days
        description: Filters to last 30 days
        expr: QUERY_START_TIME >= DATEADD('day', -30, CURRENT_DATE())
    dimensions:
      - name: user_name
        synonyms:
          - user
          - who accessed
        description: User who ran the query
        expr: USER_NAME
        data_type: TEXT
      - name: query_id
        synonyms:
          - query
        description: Query identifier
        expr: QUERY_ID
        data_type: TEXT
    time_dimensions:
      - name: access_date
        synonyms:
          - date
          - day
        description: Date of access
        expr: QUERY_START_TIME::DATE
        data_type: DATE
      - name: access_at
        synonyms:
          - timestamp
        description: Exact timestamp of access
        expr: QUERY_START_TIME
        data_type: TIMESTAMP
    measures:
      - name: access_count
        synonyms:
          - number of accesses
          - query count
        description: Number of access events
        expr: COUNT(*)
        data_type: NUMBER
      - name: unique_users
        synonyms:
          - distinct users
          - user count
        description: Number of distinct users accessing data
        expr: COUNT(DISTINCT USER_NAME)
        data_type: NUMBER

  - name: object_dependencies
    description: >
      Object dependency graph showing which objects reference other objects.
      Use for impact analysis and understanding downstream dependencies.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: OBJECT_DEPENDENCIES
    dimensions:
      - name: referencing_object
        synonyms:
          - downstream object
          - dependent object
        description: Object that depends on another
        expr: REFERENCING_OBJECT_NAME
        data_type: TEXT
      - name: referencing_database
        synonyms:
          - downstream database
        description: Database of the dependent object
        expr: REFERENCING_DATABASE
        data_type: TEXT
      - name: referencing_schema
        synonyms:
          - downstream schema
        description: Schema of the dependent object
        expr: REFERENCING_SCHEMA
        data_type: TEXT
      - name: referencing_object_domain
        synonyms:
          - downstream type
          - object type
        description: Type of the dependent object (TABLE, VIEW, TASK, etc.)
        expr: REFERENCING_OBJECT_DOMAIN
        data_type: TEXT
      - name: referenced_object
        synonyms:
          - upstream object
          - source object
        description: Object being depended upon
        expr: REFERENCED_OBJECT_NAME
        data_type: TEXT
      - name: referenced_database
        synonyms:
          - upstream database
          - source database
        description: Database of the source object
        expr: REFERENCED_DATABASE
        data_type: TEXT
      - name: referenced_schema
        synonyms:
          - upstream schema
          - source schema
        description: Schema of the source object
        expr: REFERENCED_SCHEMA
        data_type: TEXT
    measures:
      - name: dependency_count
        synonyms:
          - number of dependencies
        description: Count of dependency relationships
        expr: COUNT(*)
        data_type: NUMBER

  - name: task_history
    description: >
      Historical record of all Snowflake task executions including success,
      failure, and auto-suspension events. Use this to answer questions about
      pipeline reliability, failure rates, and execution duration.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: TASK_HISTORY
    filters:
      - name: recent_tasks
        synonyms:
          - recent runs
          - last 30 days
        description: Filters to task runs in the last 30 days
        expr: SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
    dimensions:
      - name: task_name
        synonyms:
          - pipeline name
          - job name
          - task
        description: The name of the Snowflake task or pipeline
        expr: NAME
        data_type: TEXT
      - name: state
        synonyms:
          - status
          - result
          - outcome
        description: >
          Execution outcome of the task. Possible values are SUCCEEDED, FAILED,
          FAILED_AND_AUTO_SUSPENDED, SKIPPED, or CANCELLED.
        expr: STATE
        data_type: TEXT
      - name: error_code
        synonyms:
          - failure code
          - error code
        description: Error code when the task failed
        expr: ERROR_CODE
        data_type: TEXT
      - name: error_message
        synonyms:
          - failure reason
          - error
          - exception
        description: Error message when the task failed
        expr: ERROR_MESSAGE
        data_type: TEXT
      - name: query_id
        synonyms:
          - query identifier
          - task query id
        description: The query ID associated with the task execution
        expr: QUERY_ID
        data_type: TEXT
      - name: root_task_id
        synonyms:
          - root task
          - parent task id
        description: The ID of the root task in the task graph
        expr: ROOT_TASK_ID
        data_type: TEXT
      - name: run_id
        synonyms:
          - run identifier
          - execution id
        description: Unique identifier for this task run
        expr: RUN_ID
        data_type: NUMBER
      - name: scheduled_time
        synonyms:
          - run time
          - execution time
          - when it ran
        description: The time the task was scheduled to run
        expr: SCHEDULED_TIME
        data_type: TIMESTAMP
      - name: completed_time
        synonyms:
          - finish time
          - end time
        description: The time the task completed
        expr: COMPLETED_TIME
        data_type: TIMESTAMP
    time_dimensions:
      - name: run_date
        synonyms:
          - date
          - day
          - when
        description: The date the task was scheduled to run
        expr: SCHEDULED_TIME::DATE
        data_type: DATE
      - name: scheduled_at
        synonyms:
          - timestamp
          - exact time
          - hour
          - last 24 hours
          - last N hours
        description: Exact timestamp the task was scheduled — use for hour-level filtering
        expr: SCHEDULED_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_runs
        synonyms:
          - number of runs
          - run count
          - executions
        description: Total number of task executions
        expr: COUNT(*)
        data_type: NUMBER
      - name: successful_runs
        synonyms:
          - successes
          - passed runs
        description: Number of task executions that succeeded
        expr: COUNT_IF(STATE = 'SUCCEEDED')
        data_type: NUMBER
      - name: failed_runs
        synonyms:
          - failures
          - failed executions
          - errors
        description: Number of task executions that failed for any reason
        expr: COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED'))
        data_type: NUMBER
      - name: failure_rate
        synonyms:
          - error rate
          - percent failed
          - reliability
        description: Percentage of task runs that failed out of total runs
        expr: ROUND(COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) / NULLIF(COUNT(*), 0) * 100, 2)
        data_type: NUMBER
      - name: avg_duration_seconds
        synonyms:
          - average run time
          - average duration
          - how long tasks take
        description: Average execution duration in seconds
        expr: ROUND(AVG(DATEDIFF('second', SCHEDULED_TIME, COMPLETED_TIME)), 2)
        data_type: NUMBER
      - name: max_duration_seconds
        synonyms:
          - longest run
          - slowest task
          - maximum duration
        description: Maximum execution duration in seconds across all runs
        expr: MAX(DATEDIFF('second', SCHEDULED_TIME, COMPLETED_TIME))
        data_type: NUMBER
      - name: auto_suspended_count
        synonyms:
          - auto suspended
          - killed pipelines
          - suspended tasks
        description: Number of tasks that failed and were automatically suspended by Snowflake
        expr: COUNT_IF(STATE = 'FAILED_AND_AUTO_SUSPENDED')
        data_type: NUMBER

  - name: warehouse_metering
    description: >
      Hourly credit consumption by warehouse. Use this to answer questions about
      cost, credit usage, warehouse efficiency, and identifying expensive or
      idle warehouses.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: WAREHOUSE_METERING_HISTORY
    filters:
      - name: recent_metering
        synonyms:
          - recent usage
          - last 30 days
        description: Filters to metering data in the last 30 days
        expr: START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
    dimensions:
      - name: warehouse_name
        synonyms:
          - warehouse
          - compute cluster
          - virtual warehouse
        description: The name of the Snowflake virtual warehouse
        expr: WAREHOUSE_NAME
        data_type: TEXT
      - name: warehouse_id
        synonyms:
          - warehouse identifier
          - warehouse number
        description: The unique numeric ID of the Snowflake virtual warehouse
        expr: WAREHOUSE_ID
        data_type: NUMBER
      - name: start_time
        synonyms:
          - hour
          - time period
          - interval start
        description: The start of the hourly metering interval
        expr: START_TIME
        data_type: TIMESTAMP
      - name: end_time
        synonyms:
          - interval end
          - period end
        description: The end of the hourly metering interval
        expr: END_TIME
        data_type: TIMESTAMP
    time_dimensions:
      - name: metering_date
        synonyms:
          - date
          - day
          - when
        description: The date of the metering interval
        expr: START_TIME::DATE
        data_type: DATE
      - name: metering_at
        synonyms:
          - timestamp
          - hour
          - last N hours
        description: Exact timestamp of the metering interval — use for hour-level filtering
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_credits
        synonyms:
          - credits used
          - cost
          - credit consumption
          - spend
        description: Total Snowflake credits consumed by the warehouse
        expr: SUM(CREDITS_USED)
        data_type: NUMBER
      - name: compute_credits
        synonyms:
          - compute cost
          - warehouse credits
        description: Credits used for compute only excluding cloud services
        expr: SUM(CREDITS_USED_COMPUTE)
        data_type: NUMBER
      - name: cloud_service_credits
        synonyms:
          - cloud services cost
          - metadata credits
        description: Credits used for cloud services like metadata operations
        expr: SUM(CREDITS_USED_CLOUD_SERVICES)
        data_type: NUMBER
      - name: attributed_compute_credits
        synonyms:
          - attributed compute
          - query attributed credits
        description: Credits attributed to compute queries
        expr: SUM(CREDITS_ATTRIBUTED_COMPUTE_QUERIES)
        data_type: NUMBER
      - name: active_hours
        synonyms:
          - hours active
          - uptime
          - hours running
        description: Number of hours the warehouse was active and consuming credits
        expr: COUNT(*)
        data_type: NUMBER
      - name: avg_credits_per_hour
        synonyms:
          - hourly cost
          - credit rate
          - burn rate
        description: Average credits consumed per active hour
        expr: ROUND(AVG(CREDITS_USED), 4)
        data_type: NUMBER

  - name: query_history
    description: >
      Detailed history of all queries executed in the account. Use this to answer
      questions about slow queries, expensive queries, bytes scanned, and
      query performance trends.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: QUERY_HISTORY
    filters:
      - name: recent_queries
        synonyms:
          - recent
          - last 30 days
        description: Filters to queries in the last 30 days
        expr: START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      - name: exclude_system_queries
        synonyms:
          - user queries only
          - exclude internal
        description: Excludes internal Snowflake system queries
        expr: QUERY_TYPE NOT IN ('SHOW', 'DESCRIBE', 'USE')
    dimensions:
      - name: query_id
        synonyms:
          - query identifier
          - query hash
          - execution id
        description: Unique identifier for each query execution
        expr: QUERY_ID
        data_type: TEXT
      - name: warehouse_name
        synonyms:
          - warehouse
          - compute
        description: The warehouse that executed the query
        expr: WAREHOUSE_NAME
        data_type: TEXT
      - name: warehouse_id
        synonyms:
          - warehouse identifier
          - warehouse number
        description: The numeric ID of the warehouse that executed the query
        expr: WAREHOUSE_ID
        data_type: NUMBER
      - name: warehouse_size
        synonyms:
          - warehouse size
          - compute size
          - cluster size
        description: The size of the warehouse that executed the query
        expr: WAREHOUSE_SIZE
        data_type: TEXT
      - name: query_type
        synonyms:
          - operation type
          - command type
        description: The type of query such as SELECT, INSERT, or CREATE
        expr: QUERY_TYPE
        data_type: TEXT
      - name: execution_status
        synonyms:
          - query status
          - success or failure
          - query outcome
        description: Whether the query succeeded or failed
        expr: EXECUTION_STATUS
        data_type: TEXT
      - name: user_name
        synonyms:
          - user
          - who ran it
          - executed by
        description: The user who executed the query
        expr: USER_NAME
        data_type: TEXT
      - name: role_name
        synonyms:
          - role
          - executed as
        description: The role used to execute the query
        expr: ROLE_NAME
        data_type: TEXT
      - name: database_name
        synonyms:
          - database
          - db
        description: The database context for the query
        expr: DATABASE_NAME
        data_type: TEXT
      - name: schema_name
        synonyms:
          - schema
        description: The schema context for the query
        expr: SCHEMA_NAME
        data_type: TEXT
      - name: error_code
        synonyms:
          - query error code
          - failure code
        description: Error code if the query failed
        expr: ERROR_CODE
        data_type: TEXT
      - name: error_message
        synonyms:
          - query error
          - failure reason
        description: Error message if the query failed
        expr: ERROR_MESSAGE
        data_type: TEXT
      - name: start_time
        synonyms:
          - when
          - query time
          - execution time
        description: When the query started executing
        expr: START_TIME
        data_type: TIMESTAMP
      - name: end_time
        synonyms:
          - query end
          - finish time
        description: When the query finished executing
        expr: END_TIME
        data_type: TIMESTAMP
    time_dimensions:
      - name: query_date
        synonyms:
          - date
          - day
        description: The date the query was executed
        expr: START_TIME::DATE
        data_type: DATE
      - name: query_at
        synonyms:
          - timestamp
          - hour
          - last N hours
        description: Exact timestamp the query started — use for hour-level filtering
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_queries
        synonyms:
          - query count
          - number of queries
          - executions
        description: Total number of queries executed
        expr: COUNT(*)
        data_type: NUMBER
      - name: avg_duration_seconds
        synonyms:
          - average query time
          - average execution time
          - how long queries take
        description: Average query execution time in seconds
        expr: ROUND(AVG(TOTAL_ELAPSED_TIME) / 1000, 2)
        data_type: NUMBER
      - name: max_duration_seconds
        synonyms:
          - slowest query
          - longest query
          - maximum query time
        description: Slowest query execution time in seconds
        expr: ROUND(MAX(TOTAL_ELAPSED_TIME) / 1000, 2)
        data_type: NUMBER
      - name: total_gb_scanned
        synonyms:
          - data scanned
          - bytes scanned
          - data processed
        description: Total gigabytes of data scanned across all queries
        expr: ROUND(SUM(BYTES_SCANNED) / 1024 / 1024 / 1024, 2)
        data_type: NUMBER
      - name: avg_gb_scanned
        synonyms:
          - average data scanned
          - average bytes per query
        description: Average gigabytes scanned per query
        expr: ROUND(AVG(BYTES_SCANNED) / 1024 / 1024 / 1024, 4)
        data_type: NUMBER
      - name: failed_queries
        synonyms:
          - query failures
          - errored queries
          - failed executions
        description: Number of queries that failed during execution
        expr: COUNT_IF(EXECUTION_STATUS = 'FAIL')
        data_type: NUMBER
      - name: total_credits
        synonyms:
          - query cost
          - credits consumed by queries
          - cloud service credits
        description: Total cloud service credits consumed by queries
        expr: ROUND(SUM(CREDITS_USED_CLOUD_SERVICES), 4)
        data_type: NUMBER
      - name: total_rows_produced
        synonyms:
          - rows returned
          - result rows
        description: Total number of rows produced across all queries
        expr: SUM(ROWS_PRODUCED)
        data_type: NUMBER
      - name: total_partitions_scanned
        synonyms:
          - partitions scanned
          - micro partitions
        description: Total number of micro-partitions scanned across all queries
        expr: SUM(PARTITIONS_SCANNED)
        data_type: NUMBER
      - name: avg_compilation_ms
        synonyms:
          - compilation time
          - parse time
          - planning overhead
        description: Average time spent compiling/planning the query in milliseconds
        expr: ROUND(AVG(COMPILATION_TIME), 2)
        data_type: NUMBER
      - name: avg_queued_ms
        synonyms:
          - queue wait
          - queuing time
          - warehouse wait
          - time waiting
        description: Average time queries spent waiting in the warehouse queue in milliseconds
        expr: ROUND(AVG(QUEUED_PROVISIONING_TIME + QUEUED_REPAIR_TIME + QUEUED_OVERLOAD_TIME), 2)
        data_type: NUMBER
      - name: total_spill_local_gb
        synonyms:
          - local spill
          - memory spill
          - disk spill
        description: Total gigabytes spilled to local disk due to memory pressure
        expr: ROUND(SUM(BYTES_SPILLED_TO_LOCAL_STORAGE) / 1024 / 1024 / 1024, 4)
        data_type: NUMBER
      - name: total_spill_remote_gb
        synonyms:
          - remote spill
          - severe spill
          - S3 spill
        description: Total gigabytes spilled to remote storage — indicates severe memory pressure
        expr: ROUND(SUM(BYTES_SPILLED_TO_REMOTE_STORAGE) / 1024 / 1024 / 1024, 4)
        data_type: NUMBER
      - name: pruning_ratio
        synonyms:
          - partition pruning
          - pruning efficiency
          - filter efficiency
        description: How effectively partition pruning reduced data scanned (0 = no pruning, 1 = perfect)
        expr: ROUND(1 - SUM(PARTITIONS_SCANNED) / NULLIF(SUM(PARTITIONS_TOTAL), 0), 4)
        data_type: NUMBER

  - name: pipe_ingestion
    description: >
      Hourly Snowpipe credit consumption and data volume. Use this to answer questions about
      Snowpipe activity, ingestion cost, bytes inserted, and files processed per pipe.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: PIPE_USAGE_HISTORY
    filters:
      - name: recent_pipe_usage
        synonyms:
          - recent ingestion
          - last 30 days
        description: Filters to pipe usage in the last 30 days
        expr: START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
    dimensions:
      - name: pipe_name
        synonyms:
          - pipe
          - snowpipe name
          - ingestion pipe
        description: The name of the Snowpipe
        expr: PIPE_NAME
        data_type: TEXT
      - name: pipe_id
        synonyms:
          - pipe identifier
        description: Unique numeric ID of the Snowpipe
        expr: PIPE_ID
        data_type: NUMBER
      - name: start_time
        synonyms:
          - interval start
          - hour
        description: Start of the hourly metering interval
        expr: START_TIME
        data_type: TIMESTAMP
    time_dimensions:
      - name: ingestion_date
        synonyms:
          - date
          - day
          - when
        description: The date of the pipe usage interval
        expr: START_TIME::DATE
        data_type: DATE
      - name: ingestion_at
        synonyms:
          - timestamp
          - hour
          - last N hours
        description: Exact timestamp of the ingestion interval — use for hour-level filtering
        expr: START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_credits
        synonyms:
          - ingestion cost
          - credits used
          - pipe credits
        description: Total credits consumed by the pipe
        expr: ROUND(SUM(CREDITS_USED), 4)
        data_type: NUMBER
      - name: total_bytes_inserted
        synonyms:
          - bytes ingested
          - data inserted
          - volume
        description: Total bytes inserted by the pipe
        expr: SUM(BYTES_INSERTED)
        data_type: NUMBER
      - name: total_files_inserted
        synonyms:
          - files loaded
          - file count
        description: Total number of files inserted by the pipe
        expr: SUM(FILES_INSERTED)
        data_type: NUMBER
      - name: avg_credits_per_file
        synonyms:
          - cost per file
          - efficiency
        description: Average credits consumed per file inserted
        expr: ROUND(SUM(CREDITS_USED) / NULLIF(SUM(FILES_INSERTED), 0), 6)
        data_type: NUMBER

  - name: dynamic_table_refresh
    description: >
      History of dynamic table refresh operations. Use this to answer questions about
      transformation health, refresh failures, data freshness lag, and upstream failures.
    base_table:
      database: SNOWFLAKE
      schema: ACCOUNT_USAGE
      table: DYNAMIC_TABLE_REFRESH_HISTORY
    filters:
      - name: recent_refreshes
        synonyms:
          - recent
          - last 30 days
        description: Filters to refreshes in the last 30 days
        expr: REFRESH_START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
    dimensions:
      - name: table_name
        synonyms:
          - dynamic table
          - table
          - transformation
        description: The name of the dynamic table
        expr: NAME
        data_type: TEXT
      - name: database_name
        synonyms:
          - database
          - db
        description: Database containing the dynamic table
        expr: DATABASE_NAME
        data_type: TEXT
      - name: schema_name
        synonyms:
          - schema
        description: Schema containing the dynamic table
        expr: SCHEMA_NAME
        data_type: TEXT
      - name: state
        synonyms:
          - refresh status
          - outcome
          - result
        description: >
          Refresh outcome. Values: SUCCEEDED, FAILED, CANCELLED, UPSTREAM_FAILED, EXECUTING.
        expr: STATE
        data_type: TEXT
      - name: refresh_action
        synonyms:
          - refresh type
          - incremental or full
        description: >
          Type of refresh performed. Values: INCREMENTAL, FULL, NO_DATA, REINITIALIZE.
        expr: REFRESH_ACTION
        data_type: TEXT
      - name: refresh_trigger
        synonyms:
          - what triggered it
          - trigger type
        description: What triggered the refresh — SCHEDULED, MANUAL, or CREATION.
        expr: REFRESH_TRIGGER
        data_type: TEXT
      - name: refresh_start_time
        synonyms:
          - when it started
          - start
        description: When the refresh began
        expr: REFRESH_START_TIME
        data_type: TIMESTAMP
    time_dimensions:
      - name: refresh_date
        synonyms:
          - date
          - day
          - when
        description: The date of the refresh
        expr: REFRESH_START_TIME::DATE
        data_type: DATE
      - name: refresh_at
        synonyms:
          - timestamp
          - hour
          - last N hours
        description: Exact timestamp the refresh started — use for hour-level filtering
        expr: REFRESH_START_TIME
        data_type: TIMESTAMP
    measures:
      - name: total_refreshes
        synonyms:
          - refresh count
          - number of refreshes
        description: Total number of refresh attempts
        expr: COUNT(*)
        data_type: NUMBER
      - name: successful_refreshes
        synonyms:
          - succeeded
          - successful
        description: Number of refreshes that succeeded
        expr: COUNT_IF(STATE = 'SUCCEEDED')
        data_type: NUMBER
      - name: failed_refreshes
        synonyms:
          - failures
          - failed
          - errors
        description: Number of refreshes that failed or were cancelled
        expr: COUNT_IF(STATE IN ('FAILED', 'CANCELLED'))
        data_type: NUMBER
      - name: upstream_failed_refreshes
        synonyms:
          - upstream failures
          - blocked refreshes
        description: Number of refreshes that failed due to an upstream table failure
        expr: COUNT_IF(STATE = 'UPSTREAM_FAILED')
        data_type: NUMBER
      - name: failure_rate
        synonyms:
          - error rate
          - percent failed
        description: Percentage of refresh attempts that failed
        expr: ROUND(COUNT_IF(STATE IN ('FAILED', 'CANCELLED')) / NULLIF(COUNT(*), 0) * 100, 2)
        data_type: NUMBER
      - name: avg_refresh_seconds
        synonyms:
          - average refresh duration
          - how long refreshes take
        description: Average refresh duration in seconds
        expr: ROUND(AVG(DATEDIFF('second', REFRESH_START_TIME, REFRESH_END_TIME)), 2)
        data_type: NUMBER

  - name: copy_history
