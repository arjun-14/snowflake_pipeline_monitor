          - loaded
        description: Number of loads that completed successfully
        expr: COUNT_IF(STATUS = 'Loaded')
        data_type: NUMBER
      - name: failed_loads
        synonyms:
          - failures
          - failed loads
          - load errors
        description: Number of loads that failed
        expr: COUNT_IF(STATUS NOT IN ('Loaded', 'Copy already done'))
        data_type: NUMBER
      - name: total_rows_loaded
        synonyms:
          - rows ingested
          - rows loaded
          - record count
        description: Total rows successfully loaded
        expr: SUM(ROW_COUNT)
        data_type: NUMBER

verified_queries:
  - name: task_failure_summary
    question: Which tasks have the highest failure rate in the last 30 days?
    sql: |
      SELECT
        NAME,
        COUNT(*) AS total_runs,
        COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) AS failed_runs,
        ROUND(COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) / NULLIF(COUNT(*), 0) * 100, 2) AS failure_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.TASK_HISTORY
      WHERE SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY NAME
      ORDER BY failure_rate_pct DESC;

  - name: warehouse_credit_consumption
    question: How many credits has each warehouse consumed?
    sql: |
      SELECT
        WAREHOUSE_NAME,
        ROUND(SUM(CREDITS_USED), 4) AS total_credits,
        COUNT(*) AS active_hours
      FROM SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY WAREHOUSE_NAME
      ORDER BY total_credits DESC;

  - name: slowest_tasks
    question: Which pipelines take the longest to run on average?
    sql: |
      SELECT
        NAME,
        COUNT(*) AS total_runs,
        ROUND(AVG(DATEDIFF('second', SCHEDULED_TIME, COMPLETED_TIME)), 2) AS avg_duration_seconds,
        MAX(DATEDIFF('second', SCHEDULED_TIME, COMPLETED_TIME)) AS max_duration_seconds
      FROM SNOWFLAKE.ACCOUNT_USAGE.TASK_HISTORY
      WHERE SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      AND STATE = 'SUCCEEDED'
      GROUP BY NAME
      ORDER BY avg_duration_seconds DESC;

  - name: idle_warehouses
    question: Which warehouses are underutilized or idle?
    sql: |
      SELECT
        WAREHOUSE_NAME,
        ROUND(SUM(CREDITS_USED), 4) AS total_credits,
        COUNT(*) AS active_hours,
        ROUND(AVG(CREDITS_USED), 4) AS avg_credits_per_hour
      FROM SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY WAREHOUSE_NAME
      HAVING total_credits < 1
      ORDER BY total_credits ASC;

  - name: flaky_pipelines
    question: Which pipelines are intermittently failing?
    sql: |
      SELECT
        NAME,
        COUNT_IF(STATE = 'SUCCEEDED') AS successful_runs,
        COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) AS failed_runs,
        ROUND(COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) / NULLIF(COUNT(*), 0) * 100, 2) AS failure_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.TASK_HISTORY
      WHERE SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY NAME
      HAVING successful_runs > 0 AND failed_runs > 0
      ORDER BY failure_rate_pct DESC;

  - name: most_expensive_queries
    question: Which queries are scanning the most data?
    sql: |
      SELECT
        QUERY_ID,
        QUERY_TYPE,
        WAREHOUSE_NAME,
        ROUND(TOTAL_ELAPSED_TIME / 1000, 2) AS duration_seconds,
        ROUND(BYTES_SCANNED / 1024 / 1024 / 1024, 2) AS gb_scanned
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      ORDER BY gb_scanned DESC
      LIMIT 20;

  - name: snowpipe_usage_by_pipe
    question: Which Snowpipes are consuming the most credits?
    sql: |
      SELECT
        PIPE_NAME,
        ROUND(SUM(CREDITS_USED), 4) AS total_credits,
        SUM(FILES_INSERTED) AS total_files_inserted,
        SUM(BYTES_INSERTED) AS total_bytes_inserted,
        ROUND(SUM(CREDITS_USED) / NULLIF(SUM(FILES_INSERTED), 0), 6) AS avg_credits_per_file
      FROM SNOWFLAKE.ACCOUNT_USAGE.PIPE_USAGE_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY PIPE_NAME
      ORDER BY total_credits DESC;

  - name: dynamic_table_failure_summary
    question: Which dynamic tables have the highest refresh failure rate?
    sql: |
      SELECT
        NAME AS table_name,
        DATABASE_NAME,
        SCHEMA_NAME,
        COUNT(*) AS total_refreshes,
        COUNT_IF(STATE = 'SUCCEEDED') AS successful_refreshes,
        COUNT_IF(STATE IN ('FAILED', 'CANCELLED')) AS failed_refreshes,
        COUNT_IF(STATE = 'UPSTREAM_FAILED') AS upstream_failed,
        ROUND(COUNT_IF(STATE IN ('FAILED', 'CANCELLED')) / NULLIF(COUNT(*), 0) * 100, 2) AS failure_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.DYNAMIC_TABLE_REFRESH_HISTORY
      WHERE REFRESH_START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY NAME, DATABASE_NAME, SCHEMA_NAME
      ORDER BY failure_rate_pct DESC;

  - name: copy_load_success_by_table
    question: How successful are data loads into each table?
    sql: |
      SELECT
        TABLE_CATALOG_NAME AS database_name,
        TABLE_SCHEMA_NAME AS schema_name,
        TABLE_NAME,
        COUNT(*) AS total_loads,
        COUNT_IF(STATUS = 'Loaded') AS successful_loads,
        COUNT_IF(STATUS NOT IN ('Loaded', 'Copy already done')) AS failed_loads,
        SUM(ROW_COUNT) AS total_rows_loaded,
        ROUND(COUNT_IF(STATUS = 'Loaded') / NULLIF(COUNT(*), 0) * 100, 2) AS success_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.COPY_HISTORY
      WHERE LAST_LOAD_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY TABLE_CATALOG_NAME, TABLE_SCHEMA_NAME, TABLE_NAME
      ORDER BY failed_loads DESC, total_loads DESC;

  - name: task_daily_failure_trend
    question: How has the task failure rate trended over the last 30 days?
    sql: |
      SELECT
        SCHEDULED_TIME::DATE AS run_date,
        COUNT(*) AS total_runs,
        COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) AS failed_runs,
        ROUND(COUNT_IF(STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')) / NULLIF(COUNT(*), 0) * 100, 2) AS failure_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.TASK_HISTORY
      WHERE SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY run_date
      ORDER BY run_date DESC;

  - name: auto_suspended_tasks
    question: Which tasks have been auto-suspended and need attention?
    sql: |
      SELECT
        NAME,
        COUNT(*) AS suspension_count,
        MAX(SCHEDULED_TIME) AS last_suspended_at,
        ERROR_CODE,
        ERROR_MESSAGE
      FROM SNOWFLAKE.ACCOUNT_USAGE.TASK_HISTORY
      WHERE STATE = 'FAILED_AND_AUTO_SUSPENDED'
        AND SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY NAME, ERROR_CODE, ERROR_MESSAGE
      ORDER BY suspension_count DESC;

  - name: task_error_breakdown
    question: What are the most common failure reasons across all tasks?
    sql: |
      SELECT
        ERROR_CODE,
        ERROR_MESSAGE,
        COUNT(*) AS occurrence_count,
        COUNT(DISTINCT NAME) AS affected_tasks
      FROM SNOWFLAKE.ACCOUNT_USAGE.TASK_HISTORY
      WHERE STATE IN ('FAILED', 'FAILED_AND_AUTO_SUSPENDED')
        AND SCHEDULED_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND ERROR_MESSAGE IS NOT NULL
      GROUP BY ERROR_CODE, ERROR_MESSAGE
      ORDER BY occurrence_count DESC
      LIMIT 20;

  - name: warehouse_daily_spend
    question: How has warehouse credit spend trended day by day?
    sql: |
      SELECT
        START_TIME::DATE AS spend_date,
        WAREHOUSE_NAME,
        ROUND(SUM(CREDITS_USED), 4) AS daily_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY spend_date, WAREHOUSE_NAME
      ORDER BY spend_date DESC, daily_credits DESC;

  - name: cloud_service_heavy_warehouses
    question: Which warehouses have excessive cloud service credit usage?
    sql: |
      SELECT
        WAREHOUSE_NAME,
        ROUND(SUM(CREDITS_USED_COMPUTE), 4) AS compute_credits,
        ROUND(SUM(CREDITS_USED_CLOUD_SERVICES), 4) AS cloud_service_credits,
        ROUND(SUM(CREDITS_USED), 4) AS total_credits,
        ROUND(SUM(CREDITS_USED_CLOUD_SERVICES) / NULLIF(SUM(CREDITS_USED), 0) * 100, 2) AS cloud_service_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.WAREHOUSE_METERING_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY WAREHOUSE_NAME
      HAVING cloud_service_pct > 10
      ORDER BY cloud_service_pct DESC;

  - name: slowest_queries
    question: Which queries are running the slowest by execution time?
    sql: |
      SELECT
        QUERY_ID,
        QUERY_TYPE,
        WAREHOUSE_NAME,
        USER_NAME,
        ROUND(TOTAL_ELAPSED_TIME / 1000, 2) AS duration_seconds,
        ROUND(BYTES_SCANNED / 1024 / 1024 / 1024, 2) AS gb_scanned,
        ROWS_PRODUCED
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND EXECUTION_STATUS = 'SUCCESS'
      ORDER BY duration_seconds DESC
      LIMIT 20;

  - name: query_failures_by_warehouse
    question: Which warehouses have the most query failures?
    sql: |
      SELECT
        WAREHOUSE_NAME,
        COUNT(*) AS total_queries,
        COUNT_IF(EXECUTION_STATUS = 'FAIL') AS failed_queries,
        ROUND(COUNT_IF(EXECUTION_STATUS = 'FAIL') / NULLIF(COUNT(*), 0) * 100, 2) AS failure_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND WAREHOUSE_NAME IS NOT NULL
      GROUP BY WAREHOUSE_NAME
      ORDER BY failed_queries DESC;

  - name: top_users_by_compute
    question: Which users are consuming the most compute resources?
    sql: |
      SELECT
        USER_NAME,
        COUNT(*) AS total_queries,
        ROUND(SUM(TOTAL_ELAPSED_TIME) / 1000 / 3600, 2) AS total_hours_elapsed,
        ROUND(SUM(BYTES_SCANNED) / 1024 / 1024 / 1024, 2) AS total_gb_scanned,
        ROUND(AVG(TOTAL_ELAPSED_TIME) / 1000, 2) AS avg_duration_seconds
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND USER_NAME IS NOT NULL
      GROUP BY USER_NAME
      ORDER BY total_gb_scanned DESC
      LIMIT 20;

  - name: cache_hit_rate
    question: What is the query result cache hit rate by warehouse?
    sql: |
      SELECT
        WAREHOUSE_NAME,
        COUNT(*) AS total_queries,
        COUNT_IF(BYTES_SCANNED = 0 AND EXECUTION_STATUS = 'SUCCESS') AS cache_hits,
        ROUND(COUNT_IF(BYTES_SCANNED = 0 AND EXECUTION_STATUS = 'SUCCESS') / NULLIF(COUNT(*), 0) * 100, 2) AS cache_hit_rate_pct
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND WAREHOUSE_NAME IS NOT NULL
      GROUP BY WAREHOUSE_NAME
      ORDER BY cache_hit_rate_pct ASC;

  - name: ingestion_daily_volume
    question: How has Snowpipe ingestion volume trended over the last 30 days?
    sql: |
      SELECT
        START_TIME::DATE AS ingestion_date,
        PIPE_NAME,
        SUM(FILES_INSERTED) AS files_inserted,
        ROUND(SUM(BYTES_INSERTED) / 1024 / 1024, 2) AS mb_inserted,
        ROUND(SUM(CREDITS_USED), 4) AS credits_used
      FROM SNOWFLAKE.ACCOUNT_USAGE.PIPE_USAGE_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY ingestion_date, PIPE_NAME
      ORDER BY ingestion_date DESC, mb_inserted DESC;

  - name: dynamic_table_slowest_refreshes
    question: Which dynamic tables have the slowest refresh times?
    sql: |
      SELECT
        NAME AS table_name,
        DATABASE_NAME,
        SCHEMA_NAME,
        COUNT(*) AS total_refreshes,
        ROUND(AVG(DATEDIFF('second', REFRESH_START_TIME, REFRESH_END_TIME)), 2) AS avg_refresh_seconds,
        MAX(DATEDIFF('second', REFRESH_START_TIME, REFRESH_END_TIME)) AS max_refresh_seconds
      FROM SNOWFLAKE.ACCOUNT_USAGE.DYNAMIC_TABLE_REFRESH_HISTORY
      WHERE REFRESH_START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND STATE = 'SUCCEEDED'
        AND REFRESH_END_TIME IS NOT NULL
      GROUP BY NAME, DATABASE_NAME, SCHEMA_NAME
      ORDER BY avg_refresh_seconds DESC;

  - name: peak_query_hours
    question: What hours of the day see the most query activity?
    sql: |
      SELECT
        HOUR(START_TIME) AS hour_of_day,
        COUNT(*) AS total_queries,
        ROUND(AVG(TOTAL_ELAPSED_TIME) / 1000, 2) AS avg_duration_seconds,
        ROUND(SUM(BYTES_SCANNED) / 1024 / 1024 / 1024, 2) AS total_gb_scanned
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_HISTORY
      WHERE START_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
      GROUP BY hour_of_day
      ORDER BY total_queries DESC;

  - name: copy_failed_loads
    question: Which tables have had failed or partial data loads recently?
    sql: |
      SELECT
        TABLE_CATALOG_NAME AS database_name,
        TABLE_SCHEMA_NAME AS schema_name,
        TABLE_NAME,
        STATUS,
        COUNT(*) AS load_count,
        MAX(LAST_LOAD_TIME) AS most_recent_failure
      FROM SNOWFLAKE.ACCOUNT_USAGE.COPY_HISTORY
      WHERE LAST_LOAD_TIME >= DATEADD('day', -30, CURRENT_TIMESTAMP())
        AND STATUS NOT IN ('Loaded', 'Copy already done')
      GROUP BY database_name, schema_name, TABLE_NAME, STATUS
      ORDER BY load_count DESC;

  - name: cost_breakdown_by_service
    question: What is the cost breakdown by service type? Where is my money going?
    sql: |
      SELECT
        SERVICE_TYPE,
        ROUND(SUM(CREDITS_USED), 2) AS total_credits,
        ROUND(SUM(CREDITS_USED) / SUM(SUM(CREDITS_USED)) OVER () * 100, 1) AS percentage_of_total
      FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_HISTORY
      WHERE START_TIME >= DATEADD('day', -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
      GROUP BY SERVICE_TYPE
      ORDER BY total_credits DESC;

  - name: bill_high_analysis
    question: Why is my Snowflake bill so high? What is driving my costs?
    sql: |
      SELECT
        SERVICE_TYPE,
        ROUND(SUM(CREDITS_USED), 2) AS total_credits,
        ROUND(SUM(CREDITS_USED) / SUM(SUM(CREDITS_USED)) OVER () * 100, 1) AS pct_of_total
      FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_HISTORY
      WHERE START_TIME >= DATEADD('day', -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
      GROUP BY SERVICE_TYPE
      ORDER BY total_credits DESC;

  - name: week_over_week_spend
    question: How did my Snowflake spend change compared to the previous week?
    sql: |
      SELECT 'current_week' AS period,
          ROUND(IFNULL(SUM(CREDITS_USED), 0), 2) AS credits_used
      FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
      UNION ALL
      SELECT 'previous_week' AS period,
          ROUND(IFNULL(SUM(CREDITS_USED), 0), 2) AS credits_used
      FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -14, CURRENT_DATE())
        AND START_TIME < DATEADD(DAY, -7, CURRENT_DATE());

  - name: daily_credit_trend
    question: What is the daily credit consumption trend over the last month?
    sql: |
      SELECT
        USAGE_DATE,
        SERVICE_TYPE,
        ROUND(CREDITS_BILLED, 2) AS credits_billed,
        ROUND(CREDITS_USED_COMPUTE, 2) AS compute_credits,
        ROUND(CREDITS_USED_CLOUD_SERVICES, 2) AS cloud_services_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_DAILY_HISTORY
      WHERE USAGE_DATE >= DATEADD('day', -30, CURRENT_DATE())
      ORDER BY USAGE_DATE DESC, credits_billed DESC;

  - name: serverless_task_costs
    question: Which serverless tasks consumed the most credits?
    sql: |
      SELECT
        TASK_NAME,
        DATABASE_NAME,
        SCHEMA_NAME,
        ROUND(SUM(CREDITS_USED), 4) AS total_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.SERVERLESS_TASK_HISTORY
      WHERE START_TIME >= DATEADD('day', -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
      GROUP BY TASK_NAME, DATABASE_NAME, SCHEMA_NAME
      ORDER BY total_credits DESC;

  - name: container_services_costs
    question: Which compute pools or container services consumed the most credits?
    sql: |
      SELECT
        COMPUTE_POOL_NAME,
        ROUND(SUM(CREDITS_USED), 2) AS total_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.SNOWPARK_CONTAINER_SERVICES_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
      GROUP BY COMPUTE_POOL_NAME
      ORDER BY total_credits DESC
      LIMIT 10;

  - name: storage_by_database
    question: Which databases use the most storage?
    sql: |
      SELECT
        DATABASE_NAME,
        ROUND(AVG(AVERAGE_DATABASE_BYTES + AVERAGE_FAILSAFE_BYTES + COALESCE(AVERAGE_HYBRID_TABLE_STORAGE_BYTES, 0)) / POW(1024, 3), 2) AS avg_total_storage_gb
      FROM SNOWFLAKE.ACCOUNT_USAGE.DATABASE_STORAGE_USAGE_HISTORY
      WHERE USAGE_DATE >= DATEADD('day', -7, CURRENT_DATE())
        AND USAGE_DATE < CURRENT_DATE()
      GROUP BY DATABASE_NAME
      ORDER BY avg_total_storage_gb DESC
      LIMIT 20;

  - name: data_transfer_by_region
    question: How much data was transferred by region and transfer type?
    sql: |
      SELECT
        TARGET_CLOUD,
        TARGET_REGION,
        TRANSFER_TYPE,
        COUNT(*) AS transfer_count,
        ROUND(SUM(BYTES_TRANSFERRED) / POW(1024, 3), 2) AS total_gb_transferred
      FROM SNOWFLAKE.ACCOUNT_USAGE.DATA_TRANSFER_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -7, CURRENT_DATE())
      GROUP BY TARGET_CLOUD, TARGET_REGION, TRANSFER_TYPE
      ORDER BY total_gb_transferred DESC;

  - name: clustering_costs
    question: Which tables are driving auto-clustering expenses?
    sql: |
      SELECT
        DATABASE_NAME,
        SCHEMA_NAME,
        TABLE_NAME,
        ROUND(SUM(CREDITS_USED), 2) AS total_clustering_credits,
        COUNT(*) AS clustering_events
      FROM SNOWFLAKE.ACCOUNT_USAGE.AUTOMATIC_CLUSTERING_HISTORY
      WHERE START_TIME >= DATEADD('month', -1, CURRENT_DATE())
      GROUP BY DATABASE_NAME, SCHEMA_NAME, TABLE_NAME
      ORDER BY total_clustering_credits DESC
      LIMIT 20;

  - name: top_users_by_query_cost
    question: Which users are spending the most on queries by attributed credits?
    sql: |
      SELECT
        USER_NAME,
        COUNT(DISTINCT QUERY_ID) AS query_count,
        ROUND(SUM(CREDITS_ATTRIBUTED_COMPUTE + COALESCE(CREDITS_USED_QUERY_ACCELERATION, 0)), 2) AS total_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_ATTRIBUTION_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
      GROUP BY USER_NAME
      ORDER BY total_credits DESC
      LIMIT 20;

  - name: most_expensive_query_patterns
    question: What are the most expensive query patterns by parameterized hash?
    sql: |
      SELECT
        QUERY_PARAMETERIZED_HASH,
        ROUND(SUM(CREDITS_ATTRIBUTED_COMPUTE), 2) AS total_credits,
        COUNT(QUERY_ID) AS execution_count,
        ROUND(SUM(CREDITS_ATTRIBUTED_COMPUTE) / NULLIF(COUNT(QUERY_ID), 0), 4) AS avg_credits_per_execution,
        ANY_VALUE(QUERY_ID) AS example_query_id
      FROM SNOWFLAKE.ACCOUNT_USAGE.QUERY_ATTRIBUTION_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE()
        AND QUERY_PARAMETERIZED_HASH IS NOT NULL
      GROUP BY QUERY_PARAMETERIZED_HASH
      ORDER BY total_credits DESC
      LIMIT 10;

  - name: cost_increase_analysis
    question: Why has my cost increased? Which services increased month over month?
    sql: |
      WITH monthly_service_costs AS (
          SELECT DATE_TRUNC('month', START_TIME) AS cost_month, SERVICE_TYPE, SUM(CREDITS_USED) AS total_credits
          FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_HISTORY
          WHERE START_TIME >= DATE_TRUNC('month', DATEADD('month', -2, CURRENT_DATE()))
          GROUP BY DATE_TRUNC('month', START_TIME), SERVICE_TYPE
      ),
      service_comparison AS (
          SELECT SERVICE_TYPE,
              SUM(CASE WHEN cost_month = DATE_TRUNC('month', CURRENT_DATE()) THEN total_credits ELSE 0 END) AS current_month_credits,
              SUM(CASE WHEN cost_month = DATE_TRUNC('month', DATEADD('month', -1, CURRENT_DATE())) THEN total_credits ELSE 0 END) AS previous_month_credits
          FROM monthly_service_costs
          GROUP BY SERVICE_TYPE
      )
      SELECT SERVICE_TYPE,
          ROUND(current_month_credits, 2) AS current_month_credits,
          ROUND(previous_month_credits, 2) AS previous_month_credits,
          ROUND(current_month_credits - previous_month_credits, 2) AS credit_increase,
          CASE WHEN previous_month_credits > 0
              THEN ROUND(((current_month_credits - previous_month_credits) / previous_month_credits) * 100, 2)
              ELSE NULL END AS percentage_increase
      FROM service_comparison
      WHERE current_month_credits > previous_month_credits
      ORDER BY credit_increase DESC;

  - name: total_credits_last_week
    question: How many total credits were used last week?
    sql: |
      SELECT
        ROUND(SUM(CREDITS_USED), 2) AS total_credits
      FROM SNOWFLAKE.ACCOUNT_USAGE.METERING_HISTORY
      WHERE START_TIME >= DATEADD(DAY, -7, CURRENT_DATE())
        AND START_TIME < CURRENT_DATE();

  - name: table_popularity_by_access
    question: Which tables are the most popular or most accessed?
    sql: |
      SELECT
        DIRECTOBJECTS_ACCESSED.value:objectName::STRING AS table_name,
        DIRECTOBJECTS_ACCESSED.value:objectDomain::STRING AS object_type,
        COUNT(DISTINCT QUERY_ID) AS access_count,
        COUNT(DISTINCT USER_NAME) AS unique_users,
        MAX(QUERY_START_TIME) AS last_accessed
      FROM SNOWFLAKE.ACCOUNT_USAGE.ACCESS_HISTORY,
        LATERAL FLATTEN(input => DIRECT_OBJECTS_ACCESSED) AS DIRECTOBJECTS_ACCESSED
      WHERE QUERY_START_TIME >= DATEADD('day', -30, CURRENT_DATE())
        AND DIRECTOBJECTS_ACCESSED.value:objectDomain::STRING = 'Table'
      GROUP BY table_name, object_type
      ORDER BY access_count DESC
      LIMIT 20;

  - name: unused_tables
    question: Which tables haven't been accessed recently and might be stale?
    sql: |
      SELECT
        TABLE_CATALOG AS database_name,
        TABLE_SCHEMA AS schema_name,
        TABLE_NAME,
        LAST_ALTERED,
        ROW_COUNT,
        ROUND(BYTES / POW(1024, 3), 2) AS size_gb
      FROM SNOWFLAKE.ACCOUNT_USAGE.TABLES
      WHERE DELETED IS NULL
        AND TABLE_TYPE = 'BASE TABLE'
        AND LAST_ALTERED < DATEADD('day', -90, CURRENT_DATE())
        AND BYTES > 0
      ORDER BY BYTES DESC
      LIMIT 20;

  - name: object_dependencies_downstream
    question: What objects depend on or are downstream of a given table?
    sql: |
      SELECT
        REFERENCING_DATABASE AS downstream_database,
        REFERENCING_SCHEMA AS downstream_schema,
        REFERENCING_OBJECT_NAME AS downstream_object,
        REFERENCING_OBJECT_DOMAIN AS object_type,
        REFERENCED_DATABASE AS source_database,
        REFERENCED_SCHEMA AS source_schema,
        REFERENCED_OBJECT_NAME AS source_object
      FROM SNOWFLAKE.ACCOUNT_USAGE.OBJECT_DEPENDENCIES
      WHERE REFERENCED_DATABASE IS NOT NULL
      ORDER BY REFERENCED_OBJECT_NAME, REFERENCING_OBJECT_NAME
      LIMIT 50;

  - name: recent_schema_changes
    question: What tables or columns were recently created or altered?
    sql: |
      SELECT
        TABLE_CATALOG AS database_name,
        TABLE_SCHEMA AS schema_name,
        TABLE_NAME,
        TABLE_TYPE,
        CREATED,
        LAST_ALTERED,
        ROW_COUNT,
        ROUND(BYTES / POW(1024, 3), 3) AS size_gb
      FROM SNOWFLAKE.ACCOUNT_USAGE.TABLES
      WHERE DELETED IS NULL
        AND LAST_ALTERED >= DATEADD('day', -7, CURRENT_DATE())
      ORDER BY LAST_ALTERED DESC
      LIMIT 30;